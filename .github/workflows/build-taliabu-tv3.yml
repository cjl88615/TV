name: Build Taliabu TV3 APK

on:
  push:
    branches:
      - taliabu-tv3-custom
  pull_request:
    branches:
      - fongmi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add open-source Media3 compatibility sources
        shell: bash
        run: |
          set -euxo pipefail
          COMPAT_SHA=32e4ef73472cc4ffd6777a9410a3e8730b259ea1
          rm -rf /tmp/mxboxs-compat
          git init /tmp/mxboxs-compat
          git -C /tmp/mxboxs-compat remote add origin https://github.com/ssmhdssmhd/MXboxS.git
          git -C /tmp/mxboxs-compat fetch --depth 1 origin "$COMPAT_SHA"
          git -C /tmp/mxboxs-compat checkout --detach FETCH_HEAD
          test -d /tmp/mxboxs-compat/app/src/main/java/androidx/media3
          mkdir -p app/src/main/java/androidx
          cp -a /tmp/mxboxs-compat/app/src/main/java/androidx/media3 app/src/main/java/androidx/
          echo "Compatibility source files:"
          find app/src/main/java/androidx/media3 -type f | sort

      - name: Prepare local signing properties
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/taliabu-tv3-test.jks" \
            -storepass android \
            -keypass android \
            -alias taliabu-tv3 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Taliabu TV3, OU=Taliabu, O=Taliabu, L=Taliabu, C=ID"

          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/taliabu-tv3-test.jks
          keyAlias=taliabu-tv3
          storePassword=android
          EOF

      - name: Build all debug APK variants
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ ';'
          echo "Built APK files:"
          ls -lh dist
          count=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$count" -lt 4 ]; then
            echo "Expected at least 4 APK variants, found $count"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaliabuTV3-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
