name: Build Taliabu TV3 APK

on:
  push:
    branches:
      - taliabu-tv3-custom
  pull_request:
    branches:
      - fongmi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FongMi-compatible Media3 and MPV dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/webhtv-deps third_party
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/fish2018/webhtv.git /tmp/webhtv-deps
          git -C /tmp/webhtv-deps sparse-checkout set \
            third_party/maven/androidx/media3 \
            third_party/maven/io/github/anilbeesetti/nextlib-media3ext
          mkdir -p third_party
          cp -a /tmp/webhtv-deps/third_party/maven third_party/

          test -d third_party/maven/androidx/media3
          test -f third_party/maven/io/github/anilbeesetti/nextlib-media3ext/1.10.0-0.12.1-fongmi-softload-av3a-r1/nextlib-media3ext-1.10.0-0.12.1-fongmi-softload-av3a-r1.aar
          echo "Bundled custom player Maven repository:"
          du -sh third_party/maven
          find third_party/maven/androidx/media3 -maxdepth 3 -type f \
            \( -name '*.aar' -o -name '*.pom' \) | sort | head -80

      - name: Prepare local signing properties
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/taliabu-tv3-test.jks" \
            -storepass android \
            -keypass android \
            -alias taliabu-tv3 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Taliabu TV3, OU=Taliabu, O=Taliabu, L=Taliabu, C=ID"

          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/taliabu-tv3-test.jks
          keyAlias=taliabu-tv3
          storePassword=android
          EOF

      - name: Build all debug APK variants
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ ';'
          echo "Built APK files:"
          ls -lh dist
          count=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$count" -lt 4 ]; then
            echo "Expected at least 4 APK variants, found $count"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaliabuTV3-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
