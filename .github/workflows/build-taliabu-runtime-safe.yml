name: Build Taliabu TV3 Runtime Safe

on:
  push:
    branches:
      - taliabu-5.6.3-runtime-safe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Align public build versions
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/agp = "9.3.1"/agp = "9.0.1"/' gradle/libs.versions.toml
          sed -i 's/media3 = "1.11.0-alpha01-fongmi"/media3 = "1.11.0"/' gradle/libs.versions.toml
          grep -E '^(agp|media3) = ' gradle/libs.versions.toml

      - name: Fetch pinned FongMi Media3 public source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .media3
          git clone https://github.com/wobuhui666/media.git .media3
          git -C .media3 checkout 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d

      - name: Fetch Media3 compatibility settings
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/fongmi-compat
          git clone https://github.com/wobuhui666/TV.git /tmp/fongmi-compat
          git -C /tmp/fongmi-compat checkout b7c0ae16492485f1cdb83c227332ea21a793d395
          mkdir -p .github
          cp /tmp/fongmi-compat/.github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts
          rm -rf .github/media3-stubs
          cp -a /tmp/fongmi-compat/.github/media3-stubs .github/

      - name: Fetch supplemental public player dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/webhtv-deps third_party/maven
          git clone --depth 1 --filter=blob:none --sparse https://github.com/fish2018/webhtv.git /tmp/webhtv-deps
          git -C /tmp/webhtv-deps sparse-checkout set third_party/maven/androidx/media3/media3-effect third_party/maven/io/github/anilbeesetti/nextlib-media3ext
          mkdir -p third_party
          cp -a /tmp/webhtv-deps/third_party/maven third_party/

      - name: Create CI-only release signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/taliabu-runtime-safe.jks" -storepass changeit -keypass changeit -alias taliabu-runtime -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Taliabu Runtime Safe, O=Taliabu, C=ID"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/taliabu-runtime-safe.jks
          keyAlias=taliabu-runtime
          storePassword=changeit
          EOF

      - name: Build release APKs
        shell: bash
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArm64_v8aRelease --stacktrace --no-daemon --max-workers=1
          ./gradlew :app:assembleLeanbackArmeabi_v7aRelease --stacktrace --no-daemon --max-workers=1
          ./gradlew :app:assembleMobileArm64_v8aRelease --stacktrace --no-daemon --max-workers=1
          ./gradlew :app:assembleMobileArmeabi_v7aRelease --stacktrace --no-daemon --max-workers=1

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ ';'
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Taliabu-TV3-5.6.3-Runtime-Safe
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
