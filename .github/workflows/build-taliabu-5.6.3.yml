name: Build Taliabu TV3 5.6.3

on:
  push:
    branches:
      - taliabu-5.6.3-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore FongMi 5.6.3 player AARs omitted from upstream Git
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/fongmi-public-build
          git clone --filter=blob:none --no-checkout https://github.com/oinsilos/myfp.git /tmp/fongmi-public-build
          git -C /tmp/fongmi-public-build sparse-checkout init --no-cone
          git -C /tmp/fongmi-public-build sparse-checkout set 'TV-fongmi/app/libs/lib-*.aar'
          git -C /tmp/fongmi-public-build checkout 7551652afca220c8ed4b97c18cc11d41ed2f461d
          cp /tmp/fongmi-public-build/TV-fongmi/app/libs/lib-*.aar app/libs/
          ls -lh app/libs/lib-*.aar

      - name: Apply isolated public-build compatibility layer
        shell: bash
        run: |
          set -euxo pipefail
          cp -a .github/public-build-compat/app/src/main/java/. app/src/main/java/

      - name: Create CI-only signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/taliabu-ci.jks" -storepass changeit -keypass changeit -alias taliabu-ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Taliabu CI, O=Taliabu, C=ID"
          cat > local.properties <<EOF
          storeFile=$RUNNER_TEMP/taliabu-ci.jks
          keyAlias=taliabu-ci
          storePassword=changeit
          EOF

      - name: Build Leanback and Mobile release APKs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease :app:assembleMobileRelease --stacktrace --no-daemon --max-workers=2

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ ';'
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Taliabu-TV3-5.6.3
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
